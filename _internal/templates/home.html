{% extends "base.html" %}
{% block content %}
<br>
<br>
<h3>Training Periods</h3>

<div class="row">
  {% for p in periods %}
  <div class="col-md-4 mb-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">{{ p.name }}</h5>
        <p class="card-text">
          Start: {{ p.start_date }} <br>
          End: {{ p.end_date }} <br>
          Duration: {{ p.duration_value }} {{ p.duration_type }}
        </p>
        <a href="{{ url_for('view_period', period_id=p.id) }}" class="btn btn-primary btn-sm">View</a>
        <a href="{{ url_for('edit_period', period_id=p.id) }}" class="btn btn-warning btn-sm">Edit</a>
        <a href="{{ url_for('delete_period', period_id=p.id) }}" class="btn btn-danger btn-sm" 
           onclick="return confirm('Are you sure you want to delete this period?');">Delete</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
