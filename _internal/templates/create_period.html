{% extends "base.html" %}
{% block content %}
<h2>Create Training Period</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" placeholder="e.g., Batch A">
  </div>
  <div class="mb-3">
    <label class="form-label">Start Date</label>
    <input type="date" name="start_date" class="form-control" required>
  </div>
 <div class="mb-3">
  <label class="form-label">Duration Type</label>
  <select name="duration_type" class="form-select" required>
    <option value="weeks">Weeks</option>
    <option value="months">Months</option>
  </select>
</div>
<div class="mb-3">
  <label class="form-label">Duration Value</label>
  <input type="number" name="duration_value" class="form-control" min="1" value="6" required>
</div>

  <div class="mb-3">
    <label class="form-label">Weekend (check days that should be treated as holidays)</label><br/>
    {% for d in ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"] %}
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="weekend_days" value="{{ d }}" id="wd{{ d }}">
        <label class="form-check-label" for="wd{{ d }}">{{ d }}</label>
      </div>
    {% endfor %}
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="include_holidays" name="include_holidays" checked>
    <label class="form-check-label" for="include_holidays">Include Sri Lanka public holidays from CSV (if uploaded)</label>
  </div>
  <button class="btn btn-primary">Create</button>
</form>

<hr/>
<h6>Upload public holidays CSV (optional)</h6>
<form action="{{ url_for('upload_holidays') }}" method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <input type="file" name="file" accept=".csv" class="form-control-file">
  </div>
  <button class="btn btn-secondary">Upload CSV</button>
</form>
{% endblock %}
